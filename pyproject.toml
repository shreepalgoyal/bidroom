[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bidroom"
version = "0.1.0"
description = "Evidence-backed RFP response workflow for Switch rooms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shreepal Goyal" }]
keywords = ["rfp", "proposal", "switch", "agents", "compliance"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8.0"]

[project.scripts]
bidroom = "bidroom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
